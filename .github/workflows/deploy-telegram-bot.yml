name: Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - 'Telegram/TelegramBot/**'
      - '.github/workflows/deploy-telegram-bot.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Telegram/TelegramBot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Telegram/TelegramBot/package-lock.json

      - run: npm ci

      # Both suites: node --test for pure-logic files (cards.mjs, validateInitData.mjs, the
      # export script) plus vitest-pool-workers for anything touching D1/Durable Object bindings
      # (d1.mjs, playerDurableObject.mjs, adminImport.mjs) - see package.json's "test" script.
      - run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 15e2e6ae4f1776f568bdda14f832b6c5
          workingDirectory: Telegram/TelegramBot
          command: deploy
